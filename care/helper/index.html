<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helper space — PRISCION Care</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--ivory:#f7f4ed;--ink:#17151b;--purple:#6d4aff;--lilac:#ddd4ff;--muted:#777180;--line:#e4ded4}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.shell{max-width:1180px;margin:auto;padding:28px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{width:220px}.button{border:0;border-radius:999px;padding:13px 18px;background:#fff;border:1px solid var(--line);font-weight:800;cursor:pointer}.hero{padding:82px 0 42px;max-width:740px}.eyebrow{color:var(--purple);font-size:.7rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.hero h1{font:400 clamp(3rem,7vw,6rem)/.9 Georgia,serif;letter-spacing:-.07em;margin:18px 0}.hero p,.muted{color:var(--muted);line-height:1.7}.nav-actions{display:flex;gap:10px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.case{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;text-decoration:none;color:inherit;min-height:230px;display:flex;flex-direction:column;justify-content:space-between}.case:hover{border-color:var(--purple);transform:translateY(-2px)}.case h2{font:400 1.6rem Georgia,serif;margin:15px 0 8px}.case p{font-size:.85rem;color:var(--muted);line-height:1.55}.tag{color:var(--purple);font-size:.68rem;font-weight:900;text-transform:uppercase}.empty{border:1px dashed #cfc7bb;border-radius:18px;padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}@media(max-width:850px){.board{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav{align-items:flex-start;gap:14px}.nav-actions{flex-wrap:wrap;justify-content:flex-end}.board{grid-template-columns:1fr}}</style></head><body><main class="shell"><nav class="nav"><a href="/care/"><img class="brand" src="/care/assets/priscion-care-logo.png" alt="PRISCION Care"></a><div class="nav-actions"><a class="button" href="/care/">Public board</a><button class="button" onclick="signOut()">Lock space</button></div></nav><section class="hero"><div class="eyebrow">Private helper space</div><h1>Help can move with dignity.</h1><p>Browse privacy-safe verified cases and choose where your voluntary support goes. Applicant identity and private evidence remain restricted.</p></section><div id="board" class="board"><div class="empty">Loading approved cases…</div></div></main><script>const sb=window.supabase.createClient('https://sazhdnqzaqpqcralmthh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhemhkbnF6YXFwcWNyYWxtdGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzE5NjYsImV4cCI6MjA5Mzc0Nzk2Nn0.uTyw31uWTNOTV5-HzNpm46vpAJABAsHLMzW-sYOkRhc');async function start(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/care/';return}const {data}=await sb.from('public_cases').select('*').order('created_at',{ascending:false});const b=document.getElementById('board');if(!data?.length){b.innerHTML='<div class="empty">No verified cases are open for support yet.</div>';return}b.innerHTML=data.map(c=>`<a class="case" href="/care/case/?id=${encodeURIComponent(c.id)}"><div><span class="tag">${esc(c.hardship_category)}</span><h2>${esc(c.public_nickname)}</h2><p>${esc(c.public_story)}</p></div><span class="button">View case</span></a>`).join('')}async function signOut(){await sb.auth.signOut();location.href='/care/'}function esc(s){return String(s||'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}start();</script></body></html>
